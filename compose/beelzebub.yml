# ==============================================================================
# B1 — beelzebub LLM honeypot (breadth: multi-protocol decoy).
#
#   run this: docker compose -f compose/beelzebub.yml up -d
#
# Backed by the native Ollama on the host (http://host.docker.internal:11434).
# SSH honeypot on host port 2323; Prometheus metrics on 2112. `name:` pins the
# shared project so the sidecar agent reaches wazuh.manager by hostname.
# ==============================================================================
name: threat-intelligence-lab

services:
  beelzebub:
    image: m4r10/beelzebub:latest
    container_name: beelzebub
    platform: linux/amd64        # upstream publishes amd64; emulated on Apple Silicon
    restart: unless-stopped
    ports:
      - "2323:2222"              # LLM SSH honeypot
      - "2112:2112"              # Prometheus metrics
    volumes:
      - ../services/beelzebub/config:/configurations:ro
      - beelzebub-logs:/logs     # JSON event log (Wazuh reads this - see B1 plan E4)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Sidecar Wazuh agent: tails beelzebub's JSON log and forwards it to the
  # manager. Shares the SIEM's network (same pinned project name).
  beelzebub-agent:
    build:
      context: ../services/beelzebub/agent
    image: threat-lab/beelzebub-agent:latest
    container_name: beelzebub-agent
    hostname: beelzebub-agent
    restart: unless-stopped
    environment:
      - WAZUH_MANAGER=wazuh.manager
    volumes:
      - beelzebub-logs:/logs          # read beelzebub's event log
    depends_on:
      - beelzebub

volumes:
  beelzebub-logs:
