# ==============================================================================
# Threat Intelligence Lab — umbrella compose.
#
# Each stack lives in its own file under compose/. This umbrella pulls them all
# together so one command brings up the whole lab, while any stack can still be
# run on its own.
#
#   whole lab : docker compose up -d --build
#   one stack : docker compose -f compose/<stack>.yml up -d
#   tear down : docker compose down          (add -v to wipe data volumes)
#
# NOTE: `docker compose up` here starts the LLM honeypots (beelzebub + shelLM)
# too, which need the native Ollama running on the host. start_lab.sh brings up
# only the core SIEM + static honeypot so the proven detection -> response demo
# never depends on Ollama; start the LLM honeypots opt-in with the per-stack
# commands above.
#
# All stacks pin `name: threat-intelligence-lab`, so they share ONE Docker
# network and the SAME data volumes no matter how they're launched.
# ==============================================================================
name: threat-intelligence-lab

include:
  - compose/wazuh.yml
  - compose/honeypot.yml
  - compose/beelzebub.yml
  - compose/shellm.yml
