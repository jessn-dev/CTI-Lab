# One-shot: generates the TLS certificates used by the Wazuh indexer, manager
# and dashboard into ./config/wazuh_indexer_ssl_certs/. Driven by config/certs.yml.
# start_lab.sh runs this automatically the first time. To regenerate manually:
#   docker compose -f generate-certs.yml run --rm generator

services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.2
    hostname: wazuh-certs-generator
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
      - ./config/certs.yml:/config/certs.yml
