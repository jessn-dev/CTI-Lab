
<!-- Read beelzebub's JSON event log (one event per line). Wazuh's built-in
     json decoder parses the nested fields (event.Protocol, event.Command,
     event.SourceIp, ...), which the local rules then classify. -->
<ossec_config>
  <localfile>
    <log_format>json</log_format>
    <location>/logs/beelzebub.json</location>
  </localfile>
</ossec_config>
