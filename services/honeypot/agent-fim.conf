
<!-- Threat Intelligence Lab: extra agent config appended to ossec.conf.
     Real-time File Integrity Monitoring on the directories an attacker
     typically uses to stage tools and payloads. A dropped file here (e.g.
     the EICAR test file in Phase 5) raises a syscheck alert on the manager,
     which fires the VirusTotal integration (scripts/malware_capture.py). -->
<ossec_config>
  <syscheck>
    <disabled>no</disabled>
    <directories realtime="yes" check_all="yes" report_changes="yes">/tmp</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/home</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/root</directories>
    <alert_new_files>yes</alert_new_files>
  </syscheck>

  <!-- Collect SSH authentication events so the brute-force rules (5710/5712)
       fire and trigger Active Response. The stock agent config on this image
       does not read auth.log, so without this the honeypot logins are never
       ingested. rsyslog (started in entrypoint.sh) writes this file. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Phase C1: snoopy command-audit log (one line per command executed on the
       honeypot). The manager's local decoder/rules classify each command into a
       sophistication category (recon / download / persistence / evasion). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/snoopy.log</location>
  </localfile>

  <!-- The agent's wazuh-execd resolves an incoming Active Response order by
       command name against its OWN config. The manager triggers on the rule
       (see wazuh_manager.conf), but the agent must know how to run the command,
       so the <command> definition is required here too. -->
  <command>
    <name>active-defense</name>
    <executable>active_defense.py</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <command>active-defense</command>
    <location>local</location>
    <rules_id>5710,5712,5720,5763</rules_id>
    <timeout>600</timeout>
  </active-response>
</ossec_config>
