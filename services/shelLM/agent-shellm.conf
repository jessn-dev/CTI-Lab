
<!-- Threat Intelligence Lab: extra agent config appended to ossec.conf for the
     shelLM honeypot. Two log sources:
       1) auth.log  - sshd auth events (login/brute force), same as the static
          honeypot, so the built-in 5710/5712/5763 rules fire.
       2) shellm.json - one JSON line per shelLM session (written by run.sh);
          Wazuh's built-in json decoder parses honeypot/event/srcip, which the
          local rules (100310+) then classify.
     No FIM / Active Response here: shelLM is an isolated LLM chatbot with no
     real filesystem, so there is nothing to monitor or ban on this host. -->
<ossec_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/shellm.json</location>
  </localfile>
</ossec_config>
